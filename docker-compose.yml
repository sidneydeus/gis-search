version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: gis-search-postgres
    environment:
      POSTGRES_DB: gis_search
      POSTGRES_USER: gis_user
      POSTGRES_PASSWORD: gis_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_user -d gis_search"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: