services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: gis-search-postgres
    environment:
      POSTGRES_DB: gis_search
      POSTGRES_USER: gis_user
      POSTGRES_PASSWORD: gis_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_user -d gis_search"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gis-search-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://gis_user:gis_password@postgres:5432/gis_search
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/venv

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: gis-search-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: